[workspace]
resolver = "2"
members = [
    "crates/mazitunnel-core",
    "crates/mazitunnel-client",
    "crates/mazitunnel-server",
    "crates/mazitunnel-installer",
]

[workspace.package]
version = "2.0.1"
edition = "2021"
authors = ["mazi0182"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
bytes = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
socket2 = { version = "0.5", features = ["all"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flate2 = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
